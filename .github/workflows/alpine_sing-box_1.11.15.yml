name: Build sing-box 1.11.15 APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: alpine:latest

    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache \
            alpine-sdk \
            git \
            go \
            sudo \
            wget \
            curl \
            bash

      - name: Create build user
        run: |
          adduser -D builder

          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          mkdir -p /home/builder/.abuild
          mkdir -p /home/builder/packages
          mkdir -p /var/cache/distfiles

          chown -R builder:builder \
            /home/builder \
            /var/cache/distfiles

      - name: Generate abuild key
        run: |
          su builder -c "abuild-keygen -a -i -n"

      - name: Checkout aports
        run: |
          git clone \
            --depth=1 \
            https://gitlab.alpinelinux.org/alpine/aports.git \
            /home/builder/aports

          chown -R builder:builder /home/builder/aports

      - name: Patch version
        run: |
          su builder -c '
            cd /home/builder/aports/community/sing-box

            sed -i "s/^pkgver=.*/pkgver=1.11.15/" APKBUILD

            sed -i "/^sha512sums=/,\$d" APKBUILD

            abuild checksum
          '

      - name: Build package
        run: |
          su builder -c '
            cd /home/builder/aports/community/sing-box

            abuild -r
          '

      - name: Collect artifacts
        run: |
          mkdir artifacts

          find /home/builder/packages \
            -name "*.apk" \
            -exec cp {} artifacts/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-1.11.15
          path: artifacts/*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.11.15-apk
          files: artifacts/*.apk
