name: NGINX (BoringSSL)

on:
  workflow_dispatch:

jobs:
  build-nginx:
    runs-on: ubuntu-latest
    container:
      image: debian:latest
    permissions:
      contents: write

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get upgrade -y
          apt-get install -y build-essential libpcre2-8-0 libpcre2-dev zlib1g zlib1g-dev \
            libssl-dev git sudo curl wget make cmake golang g++ g++-multilib jq

      - name: Get latest Nginx release tag
        id: nginx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/nginx/nginx/tags?per_page=20" \
            | jq -r '[.[] | select(.name | startswith("release-"))] | .[0].name')
          
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Failed to get latest Nginx tag"
            exit 1
          fi
          echo "NGINX_TAG=$TAG" >> $GITHUB_ENV
          echo "Latest Nginx tag: $TAG"

      - name: Get latest BoringSSL release
        id: boringssl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/google/boringssl/releases/latest" \
            | jq -r '.tag_name')
          
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Failed to get latest BoringSSL release"
            exit 1
          fi
          echo "BORINGSSL_TAG=$TAG" >> $GITHUB_ENV
          echo "Latest BoringSSL release: $TAG"

      - name: Checkout Nginx
        uses: actions/checkout@v4
        with:
          repository: nginx/nginx
          path: nginx
          ref: ${{ env.NGINX_TAG }}
          fetch-depth: 0

      - name: Checkout BoringSSL
        uses: actions/checkout@v4
        with:
          repository: google/boringssl
          path: boringssl
          ref: ${{ env.BORINGSSL_TAG }}
          fetch-depth: 0

      - name: Build BoringSSL
        run: |
          cd boringssl
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_C_FLAGS="-march=x86-64-v3 -O3" \
                   -DCMAKE_CXX_FLAGS="-march=x86-64-v3 -O3"
          make -j$(nproc)

      - name: Build Nginx
        shell: bash
        run: |
          cd nginx
          CONF_ARGS=(
            --prefix=/usr/local/nginx
            --with-file-aio
            --with-threads
            --with-http_realip_module
            --with-http_ssl_module
            --with-http_v2_module
            --without-http_ssi_module
            --without-http_userid_module
            --without-http_access_module
            --without-http_auth_basic_module
            --without-http_mirror_module
            --without-http_status_module
            --without-http_geo_module
            --without-http_split_clients_module
            --without-http_referer_module
            --without-http_fastcgi_module
            --without-http_uwsgi_module
            --without-http_scgi_module
            --without-http_memcached_module
            --without-http_limit_conn_module
            --without-http_limit_req_module
            --without-http_empty_gif_module
            --without-http_browser_module
            --without-http_upstream_hash_module
            --without-http_upstream_ip_hash_module
            --without-http_upstream_least_conn_module
            --without-http_upstream_random_module
            --without-http_upstream_keepalive_module
            --without-http_upstream_zone_module
            --with-cc=c++
            --with-cc-opt='-I../boringssl/include -O3 -march=x86-64-v3 -flto -fno-semantic-interposition -fno-plt -pipe -fno-strict-aliasing -x c'
            --with-ld-opt='-L../boringssl/build -L../boringssl/build/crypto -lssl -lcrypto -lstdc++ -lpthread -lm -Wl,-O2 -Wl,--as-needed -Wl,--sort-common -Wl,-z,now -Wl,-z,relro -flto -Wl,-s'
          )
          ./auto/configure "${CONF_ARGS[@]}"
          make -j$(nproc)
          make install
          /usr/local/nginx/sbin/nginx -V
          echo "DATE=v$(date -u +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: Package Nginx folder
        run: tar -czvf nginx-built.tar.gz -C /usr/local --exclude='nginx/logs/*' nginx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "NGINX-BoringSSL_${{ env.NGINX_TAG }}_${{ env.BORINGSSL_TAG }}_${{ env.DATE }}"
          path: nginx-built.tar.gz
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "NGINX-BoringSSL_${{ env.NGINX_TAG }}_${{ env.BORINGSSL_TAG }}_${{ env.DATE }}"
          name: "NGINX ${{ env.NGINX_TAG }} + BoringSSL ${{ env.BORINGSSL_TAG }}"
          draft: false
          prerelease: false
          files: nginx-built.tar.gz
          body: |
            Built with:
            - Nginx: `${{ env.NGINX_TAG }}`
            - BoringSSL: `${{ env.BORINGSSL_TAG }}`
            - Build date: `${{ env.DATE }}`
